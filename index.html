<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Competition</title>
    <style>
        :root {
            --primary: #4F46E5; --primary-hover: #4338CA; --bg: #F3F4F6; --card-bg: #FFFFFF;
            --text: #1F2937; --error: #EF4444; --success: #10B981; --warning: #F59E0B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 800px; position: relative; }
        
        .center-screen { text-align: center; max-width: 500px; margin: 0 auto; }
        .center-screen h1 { margin-bottom: 10px; color: var(--primary); }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: var(--primary-hover); }
        .error-msg { color: var(--error); margin-top: 15px; font-size: 14px; display: none; }

        #quiz-screen { display: none; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .q-counter { font-weight: bold; color: #6B7280; }
        .timer-bar-container { width: 100%; height: 8px; background: #E5E7EB; border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .timer-bar { height: 100%; background: var(--success); width: 100%; transition: width 1s linear, background-color 0.3s; }
        .question-text { font-size: 22px; font-weight: 600; margin-bottom: 25px; line-height: 1.4; }
        .options label { display: block; padding: 15px; margin-bottom: 12px; border: 2px solid #E5E7EB; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .options label:hover { border-color: var(--primary); background: #F3F4F6; }
        .options input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        .options input[type="radio"]:checked + span { font-weight: bold; color: var(--primary); }
        
        #next-btn { background-color: var(--success); margin-top: 20px; }
        #next-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen" class="center-screen">
            <h1>Translation Competition</h1>
            <p style="margin-bottom: 30px; color: #6B7280;">Enter your Email and OTP to begin.</p>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="john@example.com">
            </div>
            <div class="input-group">
                <label>OTP</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP">
            </div>
            <button onclick="login()" id="login-btn">Start Quiz</button>
            <div class="error-msg" id="login-error"></div>
        </div>

        <div id="quiz-screen">
            <div class="quiz-header">
                <h2 id="welcome-text">Good luck!</h2>
                <div class="q-counter" id="q-counter">Question 1</div>
            </div>
            <div class="timer-bar-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
            <div class="question-text" id="question-text"></div>
            <div class="options" id="options-container"></div>
            <button id="next-btn" onclick="manualNext()">Next Question</button>
        </div>

        <div id="result-screen" class="center-screen" style="display: none;">
            <h1 style="color: var(--success);">Quiz Completed!</h1>
            <p style="margin: 20px 0; font-size: 18px;">सहभागिता के लिए धन्यवाद Thank you for participating. Your answers have been recorded.</p>
            <p style="color: #6B7280; font-size: 14px;">You may now close this window.</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz07esSHvstXPSWV6YZuem1FU2TGceHVpIbpf9yI6KVx1Q99kIL9IIE_TAqGJrpCqlgug/exec"
        const TIME_PER_QUESTION = 20; 

        let currentEmail = "";
        let questions = [];
        let currentQIndex = 0;
        let answers = {};
        let timerInterval;
        let timeLeft = TIME_PER_QUESTION;

        async function login() {
            const emailInput = document.getElementById('email').value.trim();
            const otpInput = document.getElementById('otp').value.trim();
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');

            if (!emailInput || !otpInput) return showError("Please enter both Email and OTP.");

            btn.disabled = true; btn.innerText = "Verifying..."; errorMsg.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    // THIS IS THE CRUCIAL FIX FOR GOOGLE APPS SCRIPT
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: "login", email: emailInput, otp: otpInput })
                });
                const data = await response.json();

                if (data.status === "success") {

    console.log("Questions received from server:", data.questions);
    console.log("Number of questions:", data.questions?.length);

    if (!Array.isArray(data.questions) || data.questions.length !== 30) {
        showError(
            "Error: The server returned " +
            (data.questions?.length || 0) +
            " questions instead of 30. Please contact the quiz administrator."
        );

        btn.disabled = false;
        btn.innerText = "Start Quiz";
        return;
    }

    currentEmail = emailInput;
    questions = data.questions;
                    document.getElementById('welcome-text').innerText = `Welcome, ${data.participantName}!`;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('quiz-screen').style.display = 'block';
                    loadQuestion(0);
                } else {
                    showError(data.message); btn.disabled = false; btn.innerText = "Start Quiz";
                }
            } catch (err) {
                console.error(err);
                showError("Connection failed. Please try again."); 
                btn.disabled = false; btn.innerText = "Start Quiz";
            }
        }

        function showError(msg) {
            const el = document.getElementById('login-error');
            el.innerText = msg; el.style.display = "block";
        }

        function loadQuestion(index) {
            if (index >= questions.length) return submitQuiz();

            currentQIndex = index;
            timeLeft = TIME_PER_QUESTION;
            const q = questions[index];

            document.getElementById('q-counter').innerText = `Question ${index + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <label><input type="radio" name="q" value="A"><span>A) ${q.options.A}</span></label>
                <label><input type="radio" name="q" value="B"><span>B) ${q.options.B}</span></label>
                <label><input type="radio" name="q" value="C"><span>C) ${q.options.C}</span></label>
                <label><input type="radio" name="q" value="D"><span>D) ${q.options.D}</span></label>
            `;

            if(answers[q.id]) {
                const radios = document.getElementsByName('q');
                radios.forEach(r => { if(r.value === answers[q.id]) r.checked = true; });
            }

            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerText = "Submit Quiz";
                nextBtn.style.backgroundColor = "var(--error)";
            } else {
                nextBtn.innerText = "Next Question";
                nextBtn.style.backgroundColor = "var(--success)";
            }

            startTimer();
        }

        function startTimer() {
            const bar = document.getElementById('timer-bar');
            clearInterval(timerInterval);
            
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.style.backgroundColor = 'var(--success)';
            
            void bar.offsetWidth; 

            bar.style.transition = `width ${TIME_PER_QUESTION}s linear, background-color 0.5s`;
            bar.style.width = '0%';

            setTimeout(() => { bar.style.backgroundColor = 'var(--warning)'; }, (TIME_PER_QUESTION/2)*1000);
            setTimeout(() => { bar.style.backgroundColor = 'var(--error)'; }, (TIME_PER_QUESTION-5)*1000);

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    saveAnswerAndNext();
                }
            }, 1000);
        }

        function manualNext() {
            clearInterval(timerInterval);
            saveAnswerAndNext();
        }

        function saveAnswerAndNext() {
            const selected = document.querySelector('input[name="q"]:checked');
            if (selected) {
                answers[questions[currentQIndex].id] = selected.value;
            } else {
                answers[questions[currentQIndex].id] = null; 
            }
            
            document.getElementById('next-btn').disabled = true;
            setTimeout(() => {
                document.getElementById('next-btn').disabled = false;
                loadQuestion(currentQIndex + 1);
            }, 200);
        }

        async function submitQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: "submit", email: currentEmail, answers: answers })
                });
            } catch (err) {
                console.log("Error submitting to server", err);
            }
        }
    </script>
</body>
</html>
